  <script>
  (function () {
    var endpoint = "https://offclock-analytics.offclock.workers.dev/event";
    var page = location.pathname;
    var start = Date.now();
    var hidden = 0;
    var hiddenAt = 0;

    function send(data) {
      try { navigator.sendBeacon(endpoint, new Blob([JSON.stringify(data)], { type: "text/plain" })); } catch (e) {}
    }

    send({ t: "pv", p: page, r: document.referrer });

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        hiddenAt = Date.now();
        sendDuration();
      } else if (hiddenAt) {
        hidden += Date.now() - hiddenAt;
        hiddenAt = 0;
      }
    });
    window.addEventListener("pagehide", sendDuration);

    function sendDuration() {
      var h = hidden + (hiddenAt ? Date.now() - hiddenAt : 0);
      var dur = Math.max(0, Math.round((Date.now() - start - h) / 1000));
      send({ t: "leave", p: page, d: dur });
    }
  })();
  </script>

  <script>
    (function () {
      var overlay = document.getElementById("lightbox");
      var overlayImg = overlay.querySelector("img");
      document.querySelectorAll("article.post img[src$='.svg']").forEach(function (img) {
        img.addEventListener("click", function () {
          overlayImg.src = img.src;
          overlayImg.alt = img.alt;
          overlay.classList.add("active");
        });
      });
      overlay.addEventListener("click", function () {
        overlay.classList.remove("active");
      });
    })();
    document.querySelectorAll("pre").forEach(function (pre) {
      var btn = document.createElement("button");
      btn.className = "copy-btn";
      btn.textContent = "copy";
      btn.addEventListener("click", function () {
        var code = pre.querySelector("code");
        navigator.clipboard.writeText((code || pre).textContent).then(function () {
          btn.textContent = "copied";
          setTimeout(function () { btn.textContent = "copy"; }, 1500);
        });
      });
      pre.style.position = "relative";
      pre.appendChild(btn);
    });
  </script>
