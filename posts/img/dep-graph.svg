<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .label { fill: #c9d1d9; font-size: 12px; }
    .label-sm { fill: #8b949e; font-size: 10px; }
    .label-bold { fill: #c9d1d9; font-size: 12px; font-weight: 600; }
    .accent { fill: #88f47d; font-size: 11px; font-weight: 500; }
    .box { stroke: #30363d; stroke-width: 1.5; rx: 6; fill: #161b22; }
    .box-highlight { stroke: #88f47d; stroke-width: 1.5; rx: 6; fill: #161b22; }
    .arrow { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-a { stroke: #58a6ff; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-a); }
    .arrow-b { stroke: #f78166; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-b); }
    .path-a { fill: #58a6ff; font-size: 11px; font-weight: 600; }
    .path-b { fill: #f78166; font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8b949e"/>
    </marker>
    <marker id="arrowhead-a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/>
    </marker>
    <marker id="arrowhead-b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f78166"/>
    </marker>
  </defs>

  <!-- Test Binary (top) -->
  <rect class="box-highlight" x="220" y="20" width="200" height="44"/>
  <text class="label-bold" x="320" y="46" text-anchor="middle">Test Binary</text>

  <!-- Arrows from test binary -->
  <path class="arrow-a" d="M 270 64 L 170 120"/>
  <path class="arrow-b" d="M 370 64 L 470 120"/>

  <!-- Path labels -->
  <text class="path-a" x="195" y="88">path A</text>
  <text class="path-b" x="420" y="88">path B</text>

  <!-- Test helper library (left) -->
  <rect class="box" x="60" y="124" width="220" height="56"/>
  <text class="label-bold" x="170" y="148" text-anchor="middle">test-helper library</text>
  <text class="label-sm" x="170" y="166" text-anchor="middle">(used only by tests)</text>

  <!-- Production populator (right) -->
  <rect class="box" x="360" y="124" width="220" height="56"/>
  <text class="label-bold" x="470" y="148" text-anchor="middle">production "populator"</text>
  <text class="label-sm" x="470" y="166" text-anchor="middle">(used by prod code)</text>

  <!-- Arrows down -->
  <path class="arrow-a" d="M 170 180 L 170 230"/>
  <path class="arrow-b" d="M 470 180 L 470 230"/>

  <!-- Dependency labels -->
  <text class="path-a" x="60" y="210">depends on SOURCE</text>
  <text class="path-b" x="380" y="210">depends on PREBUILT</text>

  <!-- libsettingsengine.so (left bottom) -->
  <rect class="box" x="60" y="234" width="220" height="70"/>
  <text class="label-bold" x="170" y="260" text-anchor="middle">libsettingsengine.so</text>
  <text class="label-sm" x="170" y="278" text-anchor="middle">(compiled from source,</text>
  <text class="label-sm" x="170" y="292" text-anchor="middle">loaded as shared library)</text>

  <!-- settingsengine.a (right bottom) -->
  <rect class="box" x="360" y="234" width="220" height="70"/>
  <text class="label-bold" x="470" y="260" text-anchor="middle">settingsengine.a</text>
  <text class="label-sm" x="470" y="278" text-anchor="middle">(vendored prebuilt archive,</text>
  <text class="label-sm" x="470" y="292" text-anchor="middle">statically linked into exe)</text>

  <!-- Bottom: both contain the same symbol -->
  <path class="arrow" d="M 170 304 L 170 350"/>
  <path class="arrow" d="M 470 304 L 470 350"/>

  <!-- Shared symbol box -->
  <rect x="80" y="354" width="480" height="46" rx="6" stroke="#88f47d" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <text class="accent" x="320" y="374" text-anchor="middle">Both contain: DocumentReader::s_emptyDoc</text>
  <text class="label-sm" x="320" y="390" text-anchor="middle">Same source, compiled twice, loaded into one process</text>
</svg>
